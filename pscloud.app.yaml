name: our-new-way
source:
  type: git
  url: https://github.com/printstudios/our-new-way.git
  ref: main
build:
  type: dockerfile
  file: Dockerfile
  image: pscloud/our-new-way:latest
runtime:
  cpu: 1.0
  memory: 2g
  replicas: 1
network:
  hostnames:
    - our-new-way.cm-printstudios.com
    - our-new-way.com
    - www.our-new-way.com
  upstream_port: 8000
env:
  PORT: "8000"
  HOSTNAME: "0.0.0.0"
  NODE_ENV: production
  PUBLIC_URL: https://our-new-way.com
  PUBLIC_REPO: https://github.com/printstudios/our-new-way
needs:
  postgres: false
  s3_buckets: []
healthcheck:
  http: /api/health
  expect: 200
  timeout_seconds: 15
